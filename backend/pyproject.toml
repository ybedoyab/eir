[project]
name = "eir-backend"
version = "0.1.0"
description = "EIR FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "eir-shared",
    "eir-agents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-auth>=2.35",
    "google-cloud-pubsub>=2.23",
    "google-cloud-firestore>=2.19",
    "google-cloud-modelarmor>=0.7.1",
    "cryptography>=43",
]

[tool.uv.sources]
eir-shared = { workspace = true }
eir-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning:app",
    "error::RuntimeWarning:app",
    "error::ResourceWarning:app",
    "error::DeprecationWarning:eir_agents",
    "error::DeprecationWarning:eir_shared",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
