services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./mocks:/app/mocks:ro
      - ./data:/app/data
    environment:
      ENVIRONMENT: development

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
