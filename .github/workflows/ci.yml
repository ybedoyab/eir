name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GCP_PROJECT: eir-ata
  GCP_REGION: us-central1
  WIF_PROVIDER: projects/658898892127/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: eir-deploy-ci@eir-ata.iam.gserviceaccount.com

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: uv sync --all-packages --all-groups
      - name: Test backend
        run: uv run --package eir-backend --group dev pytest backend/tests
      - name: Test agents
        run: uv run --package eir-agents --group dev pytest agents/tests
      - name: Lint Python
        run: uv run ruff check shared backend agents

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-manager-cache: false
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (local backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  deploy:
    needs: [backend, frontend, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: eir-ata
      - name: Deploy Cloud Run stack
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: uv run python infra/gcp/deploy.py --services-only
      - name: Seed synthetic FHIR fixtures
        env:
          FHIR_MODE: gcp
          FHIR_FALLBACK: "false"
          FHIR_PROJECT: eir-ata
          FHIR_LOCATION: us-central1
          FHIR_DATASET: eir
          FHIR_STORE: fhir-r4
        run: uv run --package eir-backend python -m app.seed_fhir
      - name: Production smoke
        run: uv run python infra/gcp/smoke_production.py
      - name: Sync Voximplant scenario
        env:
          VOXIMPLANT_CREDENTIALS: ${{ secrets.VOXIMPLANT_CREDENTIALS }}
          CREDS_FILE: ${{ runner.temp }}/voximplant-admin.json
        run: |
          if [ -z "$VOXIMPLANT_CREDENTIALS" ]; then
            echo "MANUAL_ACTION_REQUIRED: set GitHub secret VOXIMPLANT_CREDENTIALS"
            echo "Use the local Admin bootstrap JSON. Never bind it to Cloud Run."
            exit 1
          fi
          python -c "import os, pathlib; pathlib.Path(os.environ['CREDS_FILE']).write_text(os.environ['VOXIMPLANT_CREDENTIALS'], encoding='utf-8')"
          export VOXIMPLANT_CREDENTIALS="$CREDS_FILE"
          uv run --package eir-backend python infra/voximplant/provision.py --sync-scenario
