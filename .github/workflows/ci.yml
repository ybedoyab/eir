name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: uv sync --all-packages --all-groups
      - name: Test backend
        run: uv run --package eir-backend --group dev pytest backend/tests
      - name: Test agents
        run: uv run --package eir-agents --group dev pytest agents/tests
      - name: Lint Python
        run: uv run ruff check shared backend agents

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: eir-ata
      - name: Deploy Cloud Run stack
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: uv run python infra/gcp/deploy.py --services-only
      - name: Sync Voximplant scenario
        env:
          VOXIMPLANT_CREDENTIALS: ${{ secrets.VOXIMPLANT_CREDENTIALS }}
          CREDS_FILE: ${{ runner.temp }}/voximplant-admin.json
        run: |
          if [ -z "$VOXIMPLANT_CREDENTIALS" ]; then
            echo "MANUAL_ACTION_REQUIRED: set GitHub secret VOXIMPLANT_CREDENTIALS"
            echo "Use the local Admin bootstrap JSON. Never bind it to Cloud Run."
            exit 1
          fi
          python -c "import os, pathlib; pathlib.Path(os.environ['CREDS_FILE']).write_text(os.environ['VOXIMPLANT_CREDENTIALS'], encoding='utf-8')"
          export VOXIMPLANT_CREDENTIALS="$CREDS_FILE"
          uv run --package eir-backend python infra/voximplant/provision.py --sync-scenario
