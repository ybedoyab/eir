[project]
name = "eir-shared"
version = "0.1.0"
description = "Shared contracts, events, and protocols for EIR"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eir_shared"]
