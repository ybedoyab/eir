[project]
name = "eir-agents"
version = "0.1.0"
description = "EIR Google ADK recovery agents"
requires-python = ">=3.12"
dependencies = [
    "eir-shared",
    "google-adk",
    "pydantic>=2.9",
]

[tool.uv.sources]
eir-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eir_agents"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
